# SessLint docs site — GitHub Pages build (docs-spec/T-04).
#
# docs/ is the single source of truth: the site renders the SAME markdown
# GitHub renders — no second copy, no duplication. No `nav:` key by design:
# mkdocs auto-includes every file under docs_dir, so new rule/recipe/ADR
# docs appear in the site automatically (nav drift is impossible).
site_name: SessLint
site_description: >-
  Offline, zero-dependency session-integrity checker and conservative
  repair engine for AI agent session ledgers.
# Served under /docs/ of the Pages site; the Astro landing site in web/ owns /.
site_url: https://hpnchanel.github.io/sesslint/docs/
repo_url: https://github.com/HPNChanel/sesslint
docs_dir: docs

# Maintainer-local evidence and task state are not part of the public site.
# These mirror the private/generated documents excluded by .gitignore.
exclude_docs: |
  /reviews/
  /ai/
  /COMPLETION_*.md
  /DELIVERY_*.md
  /RELEASE_*.generated.md
  /SANDBOX_*.md
  /WINDOWS_ACCEPTANCE.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.action.view

plugins:
  - search

# Repository links outside docs_dir use absolute GitHub URLs so the strict
# build can reject every broken in-site link without suppressing warnings.
validation:
  links:
    absolute_links: warn
    unrecognized_links: warn
  nav:
    omitted_files: warn
