[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sesslint"
dynamic = ["version"]
description = "Offline, vendor-neutral session-integrity checker and conservative repair tool."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "SessLint Maintainers" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/HPNChanel/sesslint"
Repository = "https://github.com/HPNChanel/sesslint"
Issues = "https://github.com/HPNChanel/sesslint/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.4",
    "mypy>=1.10",
]
# Build-time ONLY: used by scripts/package.py + packaging/sesslint.spec to
# produce native binaries. Never imported by src/sesslint — `dependencies`
# above MUST stay empty (zero runtime deps is a hard project invariant).
packaging = [
    "pyinstaller>=6",
]

[project.scripts]
sesslint = "sesslint.cli:main"

[tool.hatch.version]
path = "src/sesslint/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sesslint"]

[tool.hatch.build.targets.wheel.shared-data]
"schemas" = "share/sesslint/schemas"

[tool.hatch.build.targets.sdist]
include = [
    "/schemas",
    "/src",
    "/tests",
    "/fixtures",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["src/sesslint"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["src/sesslint"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --basetemp=.pytest_temp"
