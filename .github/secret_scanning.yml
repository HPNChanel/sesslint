# Secret scanning exclusions — sesslint fixtures are synthetic by contract.
#
# Every directory under fixtures/ carries a PROVENANCE.json declaring
# `contains_real_data: false` (AGENTS.md hard invariant). Secret-shaped
# tokens there are generated placeholders that exercise the SL009
# secret-detector — they must keep realistic formats to be useful, and
# none are functional credentials.
#
# This excludes fixtures/ from secret scanning AND push protection.
paths-ignore:
  - "fixtures/**"
