name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"  # Weekly Monday 02:00 UTC benchmark run

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy --strict src/

      - name: Verify Apache-2.0 License and SPDX headers
        run: pytest -q tests/test_license.py

      - name: Verify Fixture Provenance Gate
        run: pytest -q tests/test_fixture_provenance.py

      - name: Verify Reason-Code and Recipe Documentation Gate
        run: pytest -q tests/test_rule_docs.py tests/test_registry_docs.py

      - name: Run Conformance Matrix Gate
        run: pytest -q tests/conformance/

      - name: Run Full Test Suite
        run: pytest -q

      - name: Run Acceptance & Smoke Tests
        run: pytest -q tests/test_smoke_release.py tests/accept/test_healthy.py tests/accept/test_parity.py

  offline-verification:
    name: Offline Isolation Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pre-install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Execute Offline Tests
        env:
          PIP_NO_INDEX: "1"
        run: |
          pytest -q tests/accept/test_offline.py tests/accept/test_kill.py

  action-dogfood:
    name: Dogfood sesslint-check (${{ matrix.fixture }}, ${{ matrix.expected }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: fixtures/canonical/minimal.json
            expected: pass
          - fixture: fixtures/cli/check_basic/healthy.jsonl
            expected: pass
          - fixture: fixtures/checks/graph_healthy.json
            expected: pass
          - fixture: fixtures/checks/sl005_cycle.json
            expected: fail
          - fixture: fixtures/checks/sl101_orphan.json
            expected: fail
          - fixture: fixtures/canonical/unknown_critical.json
            expected: fail
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run sesslint-check (Healthy fixture)
        if: matrix.expected == 'pass'
        uses: ./.github/actions/sesslint-check
        with:
          path: ${{ matrix.fixture }}
          source-ref: .

      - name: Run sesslint-check (Corrupt fixture)
        id: corrupt-check
        if: matrix.expected == 'fail'
        continue-on-error: true
        uses: ./.github/actions/sesslint-check
        with:
          path: ${{ matrix.fixture }}
          source-ref: .

      - name: Verify corrupt fixture failed as expected
        if: matrix.expected == 'fail'
        run: |
          if [ "${{ steps.corrupt-check.outcome }}" != "failure" ]; then
            echo "Expected outcome to be failure, but got: ${{ steps.corrupt-check.outcome }}"
            exit 1
          fi
          echo "Corrupt fixture ${{ matrix.fixture }} was correctly rejected by sesslint-check action."

  build-and-smoke:
    name: Reproducible Build & Release Smoke
    runs-on: ubuntu-latest
    needs: [test, offline-verification, action-dogfood]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tool
        run: python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Generate sha256sums.txt
        run: |
          cd dist
          sha256sum * > sha256sums.txt
          cat sha256sums.txt
          sha256sum -c sha256sums.txt

      - name: Clean environment installation smoke test
        run: |
          python -m venv test_env
          source test_env/bin/activate
          pip install --no-index --find-links=dist sesslint
          sesslint version --json
          sesslint check fixtures/cli/check_basic/healthy.jsonl --json
          deactivate

  perf-benchmark:
    name: Performance Benchmark (250k events / 100MB)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Execute 250k Performance Benchmark
        run: python bench/perf_250k.py --records 250000 --time-budget 15.0 --mem-budget 512.0

