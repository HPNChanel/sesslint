name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy --strict src/

      - name: Verify Apache-2.0 License and SPDX headers
        run: pytest -q tests/test_license.py

      - name: Verify Fixture Provenance Gate
        run: pytest -q tests/test_fixture_provenance.py

      - name: Verify Reason-Code and Recipe Documentation Gate
        run: pytest -q tests/test_rule_docs.py tests/test_registry_docs.py

      - name: Run Conformance Matrix Gate
        run: pytest -q tests/conformance/test_matrix.py

      - name: Run Full Test Suite
        run: pytest -q

      - name: Run Acceptance & Smoke Tests
        run: pytest -q tests/test_smoke_release.py tests/accept/test_healthy.py tests/accept/test_parity.py

  offline-verification:
    name: Offline Isolation Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pre-install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Execute Offline Tests
        env:
          PIP_NO_INDEX: "1"
        run: |
          pytest -q tests/accept/test_offline.py tests/accept/test_kill.py

  build-and-smoke:
    name: Reproducible Build & Release Smoke
    runs-on: ubuntu-latest
    needs: [test, offline-verification]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tool
        run: python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Generate sha256sums.txt
        run: |
          cd dist
          sha256sum * > sha256sums.txt
          cat sha256sums.txt
          sha256sum -c sha256sums.txt

      - name: Clean environment installation smoke test
        run: |
          python -m venv test_env
          source test_env/bin/activate
          pip install --no-index --find-links=dist sesslint
          sesslint version --json
          sesslint check fixtures/cli/check_basic/healthy.jsonl --json
          deactivate
