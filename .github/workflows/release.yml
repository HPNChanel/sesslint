name: Release

# Tag-gated release pipeline for SessLint (post-alpha-hardening-plan/T-07a).
#
# Contract:
#   - Triggers ONLY on pushing a v* tag; the tag must equal "v" + the package
#     version declared in src/sesslint/_version.py.
#   - Exactly one immutable artifact set is built once, then flows:
#       build -> github-draft -> pypi-publish -> github-promote
#     The `binaries` job fans out after github-draft (3-OS matrix) and attaches
#     PyInstaller executables to the draft release; it never gates
#     pypi-publish (PyPI ships only wheel+sdist) — github-promote waits for it
#     so the public release is complete.
#   - A draft GitHub Release (with all assets) is staged BEFORE PyPI publish;
#     it is promoted to public only after PyPI publish succeeds.
#   - SOURCE_DATE_EPOCH is derived from the tagged commit timestamp so builds
#     are reproducible (T-08 reuses the same rule for byte-parity checks).
#   - Permissions are minimal: contents:write only on github-draft, binaries
#     (asset upload), and github-promote; id-token:write only on pypi-publish
#     (Trusted Publisher / OIDC — no PyPI API token exists anywhere).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  ARTIFACT_NAME: release-dist

jobs:
  build:
    name: Build immutable artifact set
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Sigstore keyless signing (Fulcio OIDC)
    outputs:
      artifact-subjects: ${{ steps.subjects.outputs.subjects }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate tag matches package version
        run: |
          set -euo pipefail
          pkg_version="$(python -c "import re, pathlib; m = re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('src/sesslint/_version.py').read_text()); print(m.group(1))")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag/version mismatch: tag '${GITHUB_REF_NAME}' implies '${tag_version}' but _version.py declares '${pkg_version}'"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package version ${pkg_version}"

      - name: Install pinned build tooling
        run: python -m pip install "build==1.2.2.post1" "hatchling==1.27.0"

      - name: Build sdist and wheel (reproducible, no build isolation)
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}"
          python -m build --no-isolation --sdist --wheel

      - name: Generate man pages and deterministic tarball
        run: |
          set -euo pipefail
          python scripts/gen_man.py --out dist/man
          # Reproducible tarball: sorted entries, epoch mtimes, gzip -n
          # (no embedded timestamp) — identical bytes across rebuilds.
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 --group=0 --numeric-owner \
            --use-compress-program='gzip -n' \
            -cf "dist/sesslint-${GITHUB_REF_NAME#v}-man.tar.gz" -C dist man

      - name: Generate sha256sums and artifact manifest
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.whl *.tar.gz > sha256sums.txt
          sha256sum -c sha256sums.txt
          python - <<'PY'
          import hashlib, json, os, pathlib
          files = sorted(p for p in pathlib.Path('.').iterdir() if p.suffix in {'.whl', '.gz'} or p.name.endswith('.tar.gz'))
          manifest = {
              "tag": os.environ["GITHUB_REF_NAME"],
              "commit": os.environ["GITHUB_SHA"],
              "source_date_epoch": int(os.environ["SOURCE_DATE_EPOCH"]),
              "artifacts": {
                  p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in files
              },
          }
          pathlib.Path("artifact-manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          print(pathlib.Path("artifact-manifest.json").read_text())
          PY

      - name: Compute SLSA provenance subjects (base64 sha256sum output)
        id: subjects
        working-directory: dist
        run: |
          set -euo pipefail
          echo "subjects=$(sha256sum -- *.whl *.tar.gz sha256sums.txt artifact-manifest.json | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Install cosign (keyless signing)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign artifacts (Sigstore keyless, repo OIDC identity)
        run: |
          set -euo pipefail
          cd dist
          for f in *.whl *.tar.gz sha256sums.txt artifact-manifest.json; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
          ls -la *.sigstore.json

      - name: Upload release artifact set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/
          if-no-files-found: error

  github-draft:
    name: Stage draft GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download release artifact set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/

      - name: Create draft release with all assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist && sha256sum -c sha256sums.txt && cd ..
          gh release create "$GITHUB_REF_NAME" \
            --repo "${{ github.repository }}" \
            --draft \
            --title "SessLint ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.whl dist/*.tar.gz dist/sha256sums.txt dist/artifact-manifest.json \
            dist/*.sigstore.json

  binaries:
    name: Build native binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: github-draft
    permissions:
      contents: write
      id-token: write  # Sigstore keyless signing (Fulcio OIDC)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install packaging toolchain (build-time only)
        run: python -m pip install -e ".[packaging]"

      - name: Build binary + SHA256SUMS (signing hooks are opt-in via env)
        run: python scripts/package.py --platforms auto --outdir dist/bin

      - name: Smoke test binary
        shell: bash
        run: |
          set -euo pipefail
          bin="$(find dist/bin -maxdepth 1 -type f -name 'sesslint-*' \
            ! -name '*.asc' ! -name 'SHA256SUMS' | sort | head -n 1)"
          test -n "$bin" || { echo "no binary produced"; exit 1; }
          chmod +x "$bin" 2>/dev/null || true
          "$bin" version --json
          "$bin" check fixtures/cli/check_basic/healthy.jsonl --json

      - name: Rename SHA256SUMS to a per-OS unique asset name
        shell: bash
        run: mv dist/bin/SHA256SUMS "dist/bin/SHA256SUMS-${{ matrix.os }}"

      - name: Install cosign (keyless signing)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign binaries (Sigstore keyless, repo OIDC identity)
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/bin/*; do
            case "$f" in *.sigstore.json) continue;; esac
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
          ls -la dist/bin/*.sigstore.json

      - name: Upload linux binary as image-job input
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sesslint-linux-x86_64
          path: dist/bin/sesslint-*-linux-x86_64
          retention-days: 1

      - name: Attach binaries to draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/bin/* --repo "${{ github.repository }}"

  provenance:
    name: Generate SLSA provenance (Build L3)
    needs: [build, github-draft]
    permissions:
      actions: read   # read workflow run metadata
      id-token: write # sign provenance via Fulcio OIDC
      contents: write # upload .intoto.jsonl to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.artifact-subjects }}
      upload-assets: true
      upload-tag-name: ${{ github.ref_name }}
      provenance-name: sesslint-provenance.intoto.jsonl
    # Non-blocking by construction: github-promote does not need this job.
    # Flip to required (add to promote needs) once verified end-to-end.

  image:
    name: Build + push GHCR image
    runs-on: ubuntu-latest
    needs: [build, binaries]
    permissions:
      contents: read
      packages: write # push ghcr.io/<owner>/sesslint
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/sesslint
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout (Dockerfile source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download linux binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sesslint-linux-x86_64
          path: image-context

      - name: Prepare build context
        run: |
          set -euo pipefail
          mv image-context/sesslint-*-linux-x86_64 image-context/sesslint
          chmod +x image-context/sesslint
          cp Dockerfile image-context/Dockerfile

      - name: Build image
        run: docker build -t "$IMAGE:$TAG" image-context

      - name: Smoke test image
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE:$TAG" version --json
          docker run --rm "$IMAGE:$TAG" check --help >/dev/null

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push release tags
        run: |
          set -euo pipefail
          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

  pypi-publish:
    name: Publish to PyPI (Trusted Publisher / OIDC)
    runs-on: ubuntu-latest
    needs: github-draft
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release artifact set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/

      - name: Verify artifact hashes
        run: |
          set -euo pipefail
          cd dist && sha256sum -c sha256sums.txt && cd ..

      - name: Stage packages-only directory for PyPI
        run: |
          set -euo pipefail
          mkdir -p pypi_dist
          cp dist/*.whl dist/*.tar.gz pypi_dist/
          ls -la pypi_dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi_dist/

  github-promote:
    name: Promote draft release to public
    runs-on: ubuntu-latest
    needs: [pypi-publish, binaries]
    permissions:
      contents: write
    steps:
      - name: Promote existing draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "${{ github.repository }}" --draft=false
