# Scoped mutation testing (qa-infra T-02) — informational, never a PR gate.
# mutmut 3 requires os.fork → POSIX runner only (ubuntu). Runs weekly and on
# demand; results upload as artifacts for the triage protocol in
# docs/MUTATION_TESTING.md.
name: mutation

on:
  schedule:
    - cron: "0 3 * * 0" # weekly, Sunday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutmut:
    name: Scoped mutation run (checks/, planner, executor, io)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv (pip — no extra action pin)
        run: python -m pip install "uv>=0.5"

      - name: Sync dev + mutation extras
        run: uv sync --extra dev --extra mutation

      - name: Baseline timing (tests must pass unmutated)
        run: uv run pytest -q tests/checks/ tests/repair/ tests/io/ tests/engine/

      - name: Run scoped mutation testing
        run: |
          set -o pipefail
          uv run mutmut run 2>&1 | tee mutmut-run.log || true

      - name: Export results
        if: always()
        run: |
          uv run mutmut results > mutmut-results.txt 2>&1 || true
          uv run mutmut junitxml > mutmut-junit.xml 2>&1 || true

      - name: Upload mutation report artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mutmut-results
          path: |
            mutmut-run.log
            mutmut-results.txt
            mutmut-junit.xml
            mutants/
          retention-days: 30
