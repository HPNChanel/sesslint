name: "SessLint Check"
description: "Offline, vendor-neutral session integrity checker for AI agent sessions"
author: "SessLint Maintainers"

inputs:
  path:
    description: "Path to session file or directory to check"
    required: true
  profile:
    description: "Replay validation profile"
    required: false
    default: "neutral"
  format:
    description: "Session format adapter"
    required: false
    default: "auto"
  fail-on:
    description: "Failure threshold: 'error' (default) or 'warning'"
    required: false
    default: "error"
  select:
    description: "Comma-separated rule codes to run exclusively (e.g. SL101,SL102)"
    required: false
    default: ""
  ignore:
    description: "Comma-separated rule codes to skip (mutually exclusive with select)"
    required: false
    default: ""
  baseline:
    description: "Path to a sesslint baseline file suppressing known fingerprints"
    required: false
    default: ""
  write-baseline:
    description: "Write current findings as a baseline file at this path"
    required: false
    default: ""
  exclude:
    description: "Comma-separated glob patterns to exclude from directory walks"
    required: false
    default: ""
  ext:
    description: "Comma-separated file extensions to allowlist in directory walks"
    required: false
    default: ""
  skip-undetected:
    description: "Classify format-undetected files as skipped instead of unsupported ('true'/'false')"
    required: false
    default: "false"
  config:
    description: "Explicit sesslint config file path"
    required: false
    default: ""
  output-format:
    description: "Report output format: 'json' (default) or 'sarif'"
    required: false
    default: "json"
  package:
    description: "PyPI package specifier"
    required: false
    default: "sesslint"
  source-ref:
    description: "Source workspace path for source install"
    required: false
    default: ""
  python-version:
    description: "Python version for runner"
    required: false
    default: "3.11"

outputs:
  exit-code:
    description: "Exit code from sesslint check"
    value: ${{ steps.sesslint-check.outputs.exit-code }}
  verdict:
    description: "Verdict ('pass' or 'fail')"
    value: ${{ steps.sesslint-check.outputs.verdict }}
  report-json:
    description: "JSON report output from sesslint check"
    value: ${{ steps.sesslint-check.outputs.report-json }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install SessLint
      shell: python
      env:
        PACKAGE: ${{ inputs.package }}
        SOURCE_REF: ${{ inputs.source-ref }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
      run: |
        import os
        import subprocess
        import sys
        from pathlib import Path

        workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
        source_ref = os.environ["SOURCE_REF"].strip()
        package = os.environ["PACKAGE"].strip()

        if source_ref:
            source = (workspace / source_ref).resolve()
            try:
                source.relative_to(workspace)
            except ValueError as error:
                raise SystemExit("source-ref must resolve inside GITHUB_WORKSPACE") from error
            if not source.exists():
                raise SystemExit("source-ref must name an existing workspace path")
            install_target = str(source)
        elif package:
            if "\x00" in package:
                raise SystemExit("package must not contain a NUL byte")
            if package.startswith("-"):
                raise SystemExit("package must not start with an option prefix")
            install_target = package
        else:
            raise SystemExit("package is required when source-ref is empty")

        subprocess.run([sys.executable, "-m", "pip", "install", install_target], check=True)

    - name: Run SessLint Check
      id: sesslint-check
      shell: python
      env:
        TARGET_PATH: ${{ inputs.path }}
        PROFILE: ${{ inputs.profile }}
        FORMAT: ${{ inputs.format }}
        FAIL_ON: ${{ inputs.fail-on }}
        SELECT: ${{ inputs.select }}
        IGNORE: ${{ inputs.ignore }}
        BASELINE: ${{ inputs.baseline }}
        WRITE_BASELINE: ${{ inputs.write-baseline }}
        EXCLUDE: ${{ inputs.exclude }}
        EXT: ${{ inputs.ext }}
        SKIP_UNDETECTED: ${{ inputs.skip-undetected }}
        CONFIG: ${{ inputs.config }}
        OUTPUT_FORMAT: ${{ inputs.output-format }}
      run: |
        import json
        import os
        import re
        import subprocess
        import sys
        import uuid
        from pathlib import Path

        workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()

        def value(name: str) -> str:
            return os.environ.get(name, "").strip()

        def scoped_path(name: str, *, required: bool = False, exists: bool = False) -> Path | None:
            raw = value(name)
            if not raw:
                if required:
                    raise SystemExit(f"{name.lower().replace('_', '-')} is required")
                return None
            if "\x00" in raw:
                raise SystemExit(f"{name.lower().replace('_', '-')} must not contain a NUL byte")
            candidate = Path(raw)
            resolved = (candidate if candidate.is_absolute() else workspace / candidate).resolve()
            try:
                resolved.relative_to(workspace)
            except ValueError as error:
                raise SystemExit(f"{name.lower().replace('_', '-')} must resolve inside GITHUB_WORKSPACE") from error
            if exists and not resolved.exists():
                raise SystemExit(f"{name.lower().replace('_', '-')} must name an existing workspace path")
            return resolved

        def choice(name: str, allowed: set[str]) -> str:
            raw = value(name).lower()
            if raw not in allowed:
                allowed_text = ", ".join(sorted(allowed))
                raise SystemExit(f"{name.lower().replace('_', '-')} must be one of: {allowed_text}")
            return raw

        def code_list(name: str) -> str:
            raw = value(name)
            if not raw:
                return ""
            codes = [code.strip().upper() for code in raw.split(",")]
            if not all(re.fullmatch(r"SL\d{3}", code) for code in codes):
                raise SystemExit(f"{name.lower().replace('_', '-')} must be comma-separated SL### codes")
            return ",".join(codes)

        def comma_values(name: str) -> list[str]:
            raw = value(name)
            if not raw:
                return []
            values = [item.strip() for item in raw.split(",")]
            if not all(values) or any("\x00" in item for item in values):
                raise SystemExit(f"{name.lower().replace('_', '-')} contains an invalid value")
            return values

        target = scoped_path("TARGET_PATH", required=True, exists=True)
        assert target is not None
        profile = choice("PROFILE", {"neutral", "claude-strict", "openai-strict"})
        format_name = choice(
            "FORMAT", {"auto", "claude-code-jsonl", "openai-agents", "codex-rollout", "canonical"}
        )
        fail_on = choice("FAIL_ON", {"error", "warning"})
        output_format = choice("OUTPUT_FORMAT", {"json", "sarif"})
        skip_undetected = choice("SKIP_UNDETECTED", {"true", "false"})
        select = code_list("SELECT")
        ignore = code_list("IGNORE")
        if select and ignore:
            raise SystemExit("select and ignore are mutually exclusive")
        baseline = scoped_path("BASELINE", exists=True)
        config = scoped_path("CONFIG", exists=True)
        write_baseline = scoped_path("WRITE_BASELINE")
        if write_baseline is not None and not write_baseline.parent.is_dir():
            raise SystemExit("write-baseline parent directory must exist")

        command = [sys.executable, "-m", "sesslint", "check", str(target), "--profile", profile]
        command.extend(["--fail-on", fail_on])
        if output_format == "sarif":
            command.extend(["--format", "sarif"])
        else:
            command.append("--json")
        if format_name != "auto":
            command.extend(["--adapter", format_name])
        if select:
            command.extend(["--select", select])
        if ignore:
            command.extend(["--ignore", ignore])
        if baseline is not None:
            command.extend(["--baseline", str(baseline)])
        if write_baseline is not None:
            command.extend(["--write-baseline", str(write_baseline)])
        for pattern in comma_values("EXCLUDE"):
            command.extend(["--exclude", pattern])
        for extension in comma_values("EXT"):
            command.extend(["--ext", extension])
        if skip_undetected == "true":
            command.append("--skip-undetected")
        if config is not None:
            command.extend(["--config", str(config)])

        completed = subprocess.run(command, capture_output=True, text=True, check=False)
        cli_exit = completed.returncode
        stdout_text = completed.stdout
        stderr_text = completed.stderr

        assurance = "-"
        error_count = 0
        warning_count = 0

        try:
            data = json.loads(stdout_text) if stdout_text.strip() else {}
            if isinstance(data, dict):
                if "counts" in data:
                    by_sev = data.get("counts", {}).get("by_severity", {})
                    error_count = by_sev.get("error", 0) + by_sev.get("fatal", 0)
                    warning_count = by_sev.get("warning", 0)
                    assurance = str(data.get("assurance", "-"))
                elif "totals" in data:
                    files = data.get("files", [])
                    error_count = sum(f.get("error_count", 0) for f in files)
                    warning_count = sum(f.get("warning_count", 0) for f in files)
                    assurance = "N/A"
                elif data.get("version") == "2.1.0" and "runs" in data:
                    # SARIF document: count results by level
                    results = [
                        r
                        for run in data.get("runs", [])
                        for r in run.get("results", [])
                    ]
                    error_count = sum(1 for r in results if r.get("level") == "error")
                    warning_count = sum(1 for r in results if r.get("level") == "warning")
                    assurance = "N/A"
        except Exception:
            if cli_exit != 0:
                error_count = 1

        if cli_exit != 0:
            verdict = "fail"
        elif fail_on == "warning" and warning_count > 0:
            verdict = "fail"
        else:
            verdict = "pass"

        step_exit = 0 if verdict == "pass" else (cli_exit if cli_exit != 0 else 1)

        if out_path := os.environ.get("GITHUB_OUTPUT"):
            with open(out_path, "a", encoding="utf-8") as f:
                f.write(f"exit-code={step_exit}\n")
                f.write(f"verdict={verdict}\n")
                delim = f"EOF_{uuid.uuid4().hex}"
                f.write(f"report-json<<{delim}\n{stdout_text}\n{delim}\n")

        if summary_path := os.environ.get("GITHUB_STEP_SUMMARY"):
            with open(summary_path, "a", encoding="utf-8") as f:
                f.write("### SessLint Check Summary\n\n")
                f.write("| Target | Verdict | Assurance | Error count | Warning count |\n")
                f.write("| :--- | :--- | :--- | :--- | :--- |\n")
                f.write(
                    f"| `{target}` | **{verdict.upper()}** | {assurance} | {error_count} | {warning_count} |\n\n"
                )

        print(
            f"[sesslint-check] Target: {target} | Verdict: {verdict} | Assurance: {assurance} | Errors: {error_count} | Warnings: {warning_count}"
        )
        if stderr_text.strip():
            sys.stderr.write(stderr_text)
            sys.stderr.flush()

        sys.exit(step_exit)
